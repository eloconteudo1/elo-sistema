<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELO — Conteúdo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0"></script>
<style>
:root {
  --coral: #C4725A; --coral-light: #D4866E;
  --purple: #4A2976; --lavender: #BFA8D9;
  --deep: #2E1B4E; --deep2: #1D0D31;
  --off: #F3F0F4; --bg: #F4F1F8; --bg2: #EDE8F5;
  --surface: #FFFFFF; --surface2: #F0EBF8;
  --text: #2E1B4E; --text-dim: rgba(46,27,78,0.65);
  --green: #2FB989; --orange: #E07A3A; --blue: #3B82F6; --pink: #C4487A;
  --shadow: 0 18px 45px rgba(46,24,71,0.10);
  --shadow-sm: 0 4px 16px rgba(46,24,71,0.08);
  --border: 1px solid rgba(74,41,118,0.10);
  --radius: 22px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html,body{height:100%;overflow:hidden;}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* ── Topbar (idêntico ao styles.css) ── */
.elo-topbar {
  height: 72px;
  background: linear-gradient(90deg, var(--deep) 0%, var(--deep2) 100%);
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(0,0,0,.18);
}
.topbar-brand {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.elo-nav {
  flex: 1;
  display: flex;
  justify-content: center;
}
.elo-nav-inner {
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(255,255,255,.07);
  border-radius: 14px;
  padding: 4px;
}
.elo-top-tab {
  padding: 8px 20px;
  border-radius: 10px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,.6);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.elo-top-tab:hover {
  color: white;
  background: rgba(255,255,255,.10);
}
.elo-top-tab.active {
  color: white;
  background: rgba(255,255,255,.18);
  font-weight: 800;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.topbar-clock {
  text-align: right;
  line-height: 1.2;
}
.topbar-clock .time {
  font-size: 15px;
  font-weight: 700;
  color: white;
}
.topbar-clock .date {
  font-size: 11px;
  color: rgba(255,255,255,.5);
  text-transform: capitalize;
}

/* ── PAGE ── */
.page {
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 1920px;
  margin: 0 auto;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  width: 100%;
}

/* ── SEARCH BLOCK ── */
.search-block {
  background: var(--surface);
  border: var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  box-shadow: var(--shadow);
}
.search-top-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 4px;
}
.search-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--deep);
}
.search-count {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
}
.search-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 18px;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  border: 2px solid rgba(74,41,118,.12);
  border-radius: 14px;
  padding: 0 18px;
  margin-bottom: 16px;
  transition: border-color .2s;
}
.search-bar:focus-within {
  border-color: var(--coral);
}
.search-bar svg {
  flex-shrink: 0;
  color: var(--purple);
  opacity: .5;
}
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  padding: 14px 0;
  outline: none;
}
.search-input::placeholder {
  color: var(--lavender);
  font-weight: 500;
}
.filters-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.filter-select {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  background: var(--bg2);
  border: var(--border);
  border-radius: 10px;
  padding: 9px 30px 9px 14px;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L4 4L7 1' stroke='%234A2976' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
}
.btn-limpar {
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  background: transparent;
  border: var(--border);
  border-radius: 10px;
  padding: 9px 16px;
  cursor: pointer;
  transition: background .15s;
}
.btn-limpar:hover { background: var(--bg); }
.filter-stats {
  margin-left: auto;
  display: flex;
  gap: 14px;
  align-items: center;
}
.stat {
  font-size: 12px;
  color: var(--text-dim);
}
.stat-num {
  font-weight: 800;
}
.stat-num.green { color: var(--green); }
.stat-num.lav { color: var(--lavender); }

/* ── POST GRID ── */
.post-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  min-height: 200px;
}
.grid-loading {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px;
  color: var(--text-dim);
  gap: 14px;
  font-size: 13px;
  font-weight: 600;
}
.grid-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px;
  color: var(--lavender);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  gap: 8px;
}
.grid-more {
  display: flex;
  justify-content: center;
  padding: 8px 0;
}

/* Post card */
.post-card {
  background: rgba(255,255,255,.88);
  border: var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  transition: all .18s;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
}
.post-card:hover {
  box-shadow: var(--shadow);
  border-color: rgba(74,41,118,.18);
}
.post-card-tags {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  border-radius: 8px;
  padding: 3px 9px;
  white-space: nowrap;
}
.tag.esp { background: var(--bg2); color: var(--purple); }
.tag.fmt { background: rgba(196,114,90,.12); color: var(--coral); }
.tag.status-ideia { background: rgba(224,122,58,.12); color: var(--orange); }
.tag.status-aprovado { background: rgba(47,185,137,.12); color: var(--green); }
.tag.status-usado { background: rgba(191,168,217,.18); color: var(--purple); }
.post-card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-card-preview {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
  margin-bottom: 10px;
}
.post-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  border-top: var(--border);
}
.post-card-link {
  font-size: 11px;
  color: var(--blue);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.post-card-edit {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  opacity: 0;
  transition: opacity .15s;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}
.post-card:hover .post-card-edit {
  opacity: 1;
}

/* Loading state */
.spinner-sm {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid var(--lavender);
  border-top-color: var(--coral);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Load more */
.btn-loadmore {
  background: var(--surface2);
  border: var(--border);
  color: var(--purple);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 28px;
  border-radius: 12px;
  cursor: pointer;
  transition: all .15s;
}
.btn-loadmore:hover { background: var(--bg2); }
.btn-loadmore:disabled { opacity: .5; cursor: not-allowed; }

/* ── MODAL ── */
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 24px;
  animation: fadeIn .2s ease;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 20px;
  width: 580px;
  max-width: 92vw;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,.22);
  animation: fadeInUp .25s ease;
}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.modal-close{
  background:transparent;border:none;font-size:18px;cursor:pointer;
  color:var(--text-dim);padding:0 4px;line-height:1;flex-shrink:0;
}
.modal-title{font-size:17px;font-weight:800;color:var(--deep);margin-bottom:10px;line-height:1.3;}
.modal-legenda{
  font-size:13px;line-height:1.75;color:var(--text);
  background:var(--bg);border-radius:10px;padding:14px;margin-bottom:14px;
  white-space:pre-wrap;max-height:220px;overflow-y:auto;
}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.modal-item{background:var(--bg2);border-radius:9px;padding:10px 12px;}
.modal-item-label{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px;}
.modal-item-val{font-size:13px;font-weight:600;color:var(--text);}
.modal-item-val a{color:var(--blue);text-decoration:none;font-weight:600;}
.modal-item-val a:hover{text-decoration:underline;}
.modal-item-val.green{color:var(--green);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;align-items:center;}
.status-selector {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.status-btn {
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all .15s;
}
.status-btn.s-ideia { background: rgba(224,122,58,.12); color: var(--orange); }
.status-btn.s-aprovado { background: rgba(47,185,137,.12); color: var(--green); }
.status-btn.s-usado { background: rgba(191,168,217,.18); color: var(--purple); }
.status-btn.active { border-color: currentColor; }
.status-btn:hover { filter: brightness(.95); }
.modal-status-hint {
  font-size: 11px;
  color: var(--text-dim);
  flex: 1;
}
.btn-usar-modal {
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  background: var(--coral);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: opacity .2s;
}
.btn-usar-modal:hover { opacity: .88; }
.btn-cancel-modal {
  padding: 10px 20px;
  border-radius: 10px;
  border: 1.5px solid rgba(46,27,78,.15);
  background: transparent;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  color: var(--text-dim);
  font-weight: 600;
}
.btn-cancel-modal:hover{background:var(--surface2);}

/* ── TOAST ── */
.toast {
  position: fixed;
  top: 84px;
  right: 20px;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  z-index: 9000;
  opacity: 0;
  transform: translateX(20px);
  transition: all .25s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(0);
  pointer-events: all;
}
.toast.ok { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
.toast.err { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
.toast.warn { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }

/* ── EDIT MODAL ── */
.edit-modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
  align-items:center;justify-content:center;z-index:600;padding:24px;
  animation: fadeIn .2s ease;
}
.edit-modal-overlay.open{display:flex;}
.edit-modal-box{
  background:#fff;border-radius:20px;width:520px;max-width:92vw;
  padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.22);
  animation: fadeInUp .25s ease;
}
.edit-modal-title{font-size:15px;font-weight:800;color:var(--deep);margin-bottom:16px;}
.edit-field{margin-bottom:14px;}
.edit-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px;}
.edit-input, .edit-textarea, .edit-select {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid rgba(46,27,78,.15);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  color: var(--text);
  background: #fff;
  transition: border-color .2s;
}
.edit-input:focus, .edit-textarea:focus, .edit-select:focus {
  border-color: rgba(196,114,90,.5);
}
.edit-textarea{height:110px;resize:vertical;line-height:1.6;}
.edit-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="elo-topbar">
  <div class="topbar-brand">
    <img src="logo-elo.png" alt="ELO Comunicação"
      style="height:34px;width:auto;object-fit:contain;display:block;" />
  </div>
  <nav class="elo-nav">
    <div class="elo-nav-inner">
      <a href="index.html#home" class="elo-top-tab" style="text-decoration:none;">Home</a>
      <a href="index.html#radar" class="elo-top-tab" style="text-decoration:none;">Tarefas</a>
      <a href="index.html#resultado" class="elo-top-tab" style="text-decoration:none;">Resultado</a>
      <a href="index.html#clientes" class="elo-top-tab" style="text-decoration:none;">Clientes</a>
      <a href="index.html#financeiro" class="elo-top-tab" style="text-decoration:none;">Financeiro</a>
      <a href="conteudo.html" class="elo-top-tab active" style="text-decoration:none;">Conteúdo</a>
      <a href="index.html#config" class="elo-top-tab" style="text-decoration:none;">Config.</a>
    </div>
  </nav>
  <div class="topbar-right">
    <div class="topbar-clock">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="datestr"></div>
    </div>
  </div>
</header>

<!-- PAGE -->
<div class="page">
  <!-- SEARCH BLOCK -->
  <div class="search-block">
    <div class="search-top-row">
      <div class="search-title">Acervo de inspiração</div>
      <div class="search-count" id="search-count">— posts</div>
    </div>
    <div class="search-sub">Busque por tema, palavra-chave ou legenda nos posts salvos</div>
    <div class="search-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="search-input" type="text"
        placeholder="Ex: ansiedade infantil, carrossel endócrino, reels pediatria..."
        oninput="onSearchInput(this.value)">
    </div>
    <div class="filters-row">
      <select class="filter-select" id="filter-esp" onchange="applyFilters()">
        <option value="">Especialidade</option>
      </select>
      <select class="filter-select" id="filter-fmt" onchange="applyFilters()">
        <option value="">Formato</option>
        <option value="Carrossel">Carrossel</option>
        <option value="Reels">Reels</option>
        <option value="Card único">Card único</option>
        <option value="Stories">Stories</option>
        <option value="Texto">Texto</option>
      </select>
      <select class="filter-select" id="filter-status" onchange="applyFilters()">
        <option value="">Status</option>
        <option value="Ideia">Disponíveis (Ideia)</option>
        <option value="Aprovado">Aprovados</option>
        <option value="Usado">Usados</option>
      </select>
      <button class="btn-limpar" onclick="limparFiltros()">Limpar</button>
      <div class="filter-stats">
        <span class="stat"><span class="stat-num green" id="stat-disp">—</span> disponíveis</span>
        <span class="stat"><span class="stat-num lav" id="stat-usado">—</span> usados</span>
      </div>
    </div>
  </div>

  <!-- POST GRID -->
  <div class="post-grid" id="post-grid">
    <div class="grid-loading">
      <div class="spinner-sm"></div>
      Carregando acervo de inspirações...
    </div>
  </div>

  <!-- LOAD MORE -->
  <div class="grid-more" id="grid-more" style="display:none;">
    <button class="btn-loadmore" id="btn-loadmore" onclick="loadMore()">Carregar mais posts</button>
  </div>
</div>

<!-- MODAL VISUALIZAR -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalClick(event)">
  <div class="modal-box">
    <div class="modal-top">
      <div class="modal-tags" id="m-tags"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-legenda" id="m-legenda"></div>
    <div class="modal-grid" id="m-grid"></div>
    <div class="modal-footer">
      <span class="modal-status-hint">Clique no status — salva automaticamente</span>
      <button class="btn-cancel-modal" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- MODAL EDITAR -->
<div class="edit-modal-overlay" id="edit-overlay" onclick="closeEditClick(event)">
  <div class="edit-modal-box">
    <div class="edit-modal-title">Editar Post</div>
    <div class="edit-field">
      <label>Título</label>
      <input class="edit-input" id="edit-title" type="text">
    </div>
    <div class="edit-field">
      <label>Legenda</label>
      <textarea class="edit-textarea" id="edit-caption"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="edit-field">
        <label>Status</label>
        <select class="edit-select" id="edit-status">
          <option value="Ideia">Ideia</option>
          <option value="Aprovado">Aprovado</option>
          <option value="Usado">Usado</option>
        </select>
      </div>
      <div class="edit-field">
        <label>Formato</label>
        <input class="edit-input" id="edit-format" type="text">
      </div>
    </div>
    <div class="edit-footer">
      <button class="btn-cancel-modal" onclick="closeEdit()">Cancelar</button>
      <button class="btn-usar-modal" onclick="saveEdit()">Salvar alterações</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

);
// ── Gating de login (S21) ──
sb.auth.getSession().then(({ data: { session } }) => {
  if (!session) window.location.href = 'index.html';
});
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT' || !session) window.location.href = 'index.html';
});
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── Clock ──
(function tick(){
  const n = new Date();
  const clock = document.getElementById('clock');
  const dateEl = document.getElementById('datestr');
  if(clock) clock.textContent = n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(dateEl) dateEl.textContent = n.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
  setTimeout(tick,1000);
})();

// ── Toast ──
function showToast(msg, type='ok'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.className='toast'; }, 2800);
}

async function db(queryFn, errorMsg) {
  try {
    const result = await queryFn();
    if (result.error) {
      showToast((errorMsg || 'Erro') + ': ' + result.error.message, 'err');
      return { data: null, error: result.error, count: null };
    }
    return result;
  } catch (e) {
    showToast((errorMsg || 'Erro inesperado') + ': ' + e.message, 'err');
    return { data: null, error: e, count: null };
  }
}

function openConfirmModal(title, msg, onConfirm) {
  let el = document.getElementById('_confirm-overlay');
  if (!el) { el = document.createElement('div'); el.id = '_confirm-overlay'; document.body.appendChild(el); }
  el.className = 'modal-overlay open';
  el.innerHTML = `<div class="modal-box" style="max-width:380px;" onclick="event.stopPropagation()">
    <div style="padding:20px 24px 0;font-size:16px;font-weight:700;color:var(--text)">${title}</div>
    <p style="padding:12px 24px;font-size:14px;color:var(--text-dim);margin:0">${msg}</p>
    <div style="display:flex;gap:10px;padding:16px 24px;justify-content:flex-end">
      <button class="btn-cancel-modal" onclick="document.getElementById('_confirm-overlay').className='modal-overlay'">Cancelar</button>
      <button class="btn-usar-modal" style="background:#DC2626;" onclick="window._confirmFn&&window._confirmFn();document.getElementById('_confirm-overlay').className='modal-overlay'">Confirmar</button>
    </div>
  </div>`;
  el.onclick = e => { if (e.target === el) el.className = 'modal-overlay'; };
  window._confirmFn = onConfirm;
}

// ── Estado global ──
let allPosts = [];
let filteredPosts = [];
let currentPage = 0;
const PAGE_SIZE = 40;
let totalCount = 0;
let searchTimeout = null;
let currentModalPost = null;
let editingPostId = null;

// Filtros ativos
let filterEsp = '';
let filterFmt = '';
let filterStatus = '';
let filterText = '';

// ── Init ──
async function init(){
  await loadSpecialties();
  await loadStats();
  await loadPosts();
}

// ── Stats ──
async function loadStats(){
  const results = await Promise.all([
    db(() => sb.from('inspiration_posts').select('*', {count:'exact',head:true}), 'Erro contagem'),
    db(() => sb.from('inspiration_posts').select('*', {count:'exact',head:true}).eq('status','Usado'), 'Erro contagem'),
  ]);
  const total = results[0].count ?? 0;
  const usado = results[1].count ?? 0;
  const disp = total - usado;
  document.getElementById('search-count').textContent = total.toLocaleString('pt-BR') + ' posts';
  document.getElementById('stat-disp').textContent = disp.toLocaleString('pt-BR');
  document.getElementById('stat-usado').textContent = usado.toLocaleString('pt-BR');
}

// ── Especialidades (filtro dinâmico) ──
async function loadSpecialties(){
  const { data } = await db(() => sb.from('inspiration_posts').select('specialty').limit(2000), 'Erro ao carregar especialidades');
  if(!data) return;
  const set = new Set(data.map(d => d.specialty).filter(Boolean).sort());
  const sel = document.getElementById('filter-esp');
  set.forEach(esp => {
    const o = document.createElement('option');
    o.value = esp; o.textContent = esp;
    sel.appendChild(o);
  });
}

// ── Posts ──
async function loadPosts(reset=true){
  if(reset){
    currentPage = 0;
    allPosts = [];
  }
  const gridEl = document.getElementById('post-grid');
  if(reset) gridEl.innerHTML = '<div class="grid-loading"><div class="spinner-sm"></div>Carregando...</div>';

  const btn = document.getElementById('btn-loadmore');
  if(btn) btn.disabled = true;

  const from = currentPage * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  let query = sb.from('inspiration_posts')
    .select('*', { count:'exact' })
    .range(from, to)
    .order('created_at', { ascending: false });

  if(filterEsp) query = query.eq('specialty', filterEsp);
  if(filterFmt) query = query.ilike('format', `%${filterFmt}%`);
  if(filterStatus) query = query.eq('status', filterStatus);
  if(filterText) query = query.or(`title.ilike.%${filterText}%,caption.ilike.%${filterText}%`);

  const { data, count, error } = await db(() => query, 'Erro ao carregar posts');

  if(error){
    gridEl.innerHTML = '<div class="grid-empty">Erro ao carregar posts.<br>Tente novamente.</div>';
    return;
  }

  totalCount = count || 0;
  if(reset) allPosts = data || [];
  else allPosts = [...allPosts, ...(data||[])];

  renderPosts(reset);
  updateBancoMeta();

  const hasMore = allPosts.length < totalCount;
  const moreEl = document.getElementById('grid-more');
  moreEl.style.display = hasMore ? 'flex' : 'none';
  if(btn){ btn.disabled = false; btn.textContent = 'Carregar mais posts'; }
}

function renderPosts(reset=true){
  const gridEl = document.getElementById('post-grid');

  if(!allPosts.length){
    gridEl.innerHTML = '<div class="grid-empty">Nenhum post encontrado<br><span style="font-size:12px;font-weight:400;">Tente limpar os filtros</span></div>';
    return;
  }

  const startIdx = reset ? 0 : gridEl.children.length;
  const newPosts = reset ? allPosts : allPosts.slice(startIdx);

  if(reset) gridEl.innerHTML = '';

  newPosts.forEach(p => {
    const card = buildCard(p);
    gridEl.appendChild(card);
  });
}

function buildCard(p){
  const div = document.createElement('div');
  div.className = 'post-card';

  const statusClass = p.status === 'Aprovado' ? 'status-aprovado'
    : p.status === 'Usado' ? 'status-usado' : 'status-ideia';
  const statusLabel = p.status || 'Ideia';
  const esp = p.specialty || p.collection || '';
  const fmt = p.format || '';
  const title = escHtml(p.title || '(sem título)');
  const caption = escHtml((p.caption || '').slice(0, 280));

  div.innerHTML = `
    <div class="post-card-tags">
      ${esp ? `<span class="tag esp">${escHtml(esp)}</span>` : ''}
      ${fmt ? `<span class="tag fmt">${escHtml(fmt)}</span>` : ''}
      <span class="tag ${statusClass}">${statusLabel}</span>
    </div>
    <div class="post-card-title">${title}</div>
    <div class="post-card-preview">${caption}</div>
    <div class="post-card-foot">
      <span class="post-card-link" data-action="link" data-href="${escHtml(p.reference_link||'')}">↗ Ver post</span>
      <button class="post-card-edit" data-action="edit">✏️ Editar</button>
    </div>
  `;

  div.addEventListener('click', (e) => {
    const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
    if(action === 'link'){
      e.stopPropagation();
      const href = e.target.dataset.href || e.target.closest('[data-href]')?.dataset.href;
      if(href) window.open(href, '_blank');
      return;
    }
    if(action === 'edit'){
      e.stopPropagation();
      openEdit(p);
      return;
    }
    openModal(p);
  });

  return div;
}

function updateBancoMeta(){
  document.getElementById('search-count').textContent =
    totalCount.toLocaleString('pt-BR') + ' posts';
}

function loadMore(){
  currentPage++;
  loadPosts(false);
}

// ── Filtros ──
function onSearchInput(v){
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    filterText = v.trim();
    applyFilters();
  }, 350);
}

function applyFilters(){
  filterEsp = document.getElementById('filter-esp').value;
  filterFmt = document.getElementById('filter-fmt').value;
  filterStatus = document.getElementById('filter-status').value;
  loadPosts(true);
}

function limparFiltros(){
  filterEsp = ''; filterFmt = ''; filterStatus = ''; filterText = '';
  document.getElementById('search-input').value = '';
  document.getElementById('filter-esp').value = '';
  document.getElementById('filter-fmt').value = '';
  document.getElementById('filter-status').value = '';
  loadPosts(true);
}

// ── Modal visualizar ──
function openModal(p){
  currentModalPost = p;
  const esp = p.specialty || p.collection || '';
  const fmt = p.format || '';

  document.getElementById('m-tags').innerHTML = `
    ${esp ? `<span class="tag esp">${escHtml(esp)}</span>` : ''}
    ${fmt ? `<span class="tag fmt">${escHtml(fmt)}</span>` : ''}
  `;
  document.getElementById('m-title').textContent = p.title || '';
  document.getElementById('m-legenda').textContent = p.caption || '';

  const refLink = p.reference_link
    ? `<a href="${escHtml(p.reference_link)}" target="_blank" style="color:var(--blue);text-decoration:none;font-weight:600;">↗ ${escHtml(p.reference_link.replace(/^https?:\/\/(www\.)?/,'').slice(0,40))}...</a>`
    : '—';

  const currentStatus = p.status || 'Ideia';
  document.getElementById('m-grid').innerHTML = `
    <div class="modal-item">
      <div class="modal-item-label">Formato</div>
      <div class="modal-item-val">${escHtml(fmt||'—')}</div>
    </div>
    <div class="modal-item">
      <div class="modal-item-label">Especialidade</div>
      <div class="modal-item-val">${escHtml(esp||'—')}</div>
    </div>
    <div class="modal-item" style="grid-column:1/-1">
      <div class="modal-item-label">Link de referência</div>
      <div class="modal-item-val">${refLink}</div>
    </div>
    <div class="modal-item" style="grid-column:1/-1">
      <div class="modal-item-label">Status — clique para alterar</div>
      <div class="status-selector">
        <button class="status-btn s-ideia ${currentStatus==='Ideia'?'active':''}" onclick="setStatus('Ideia')">Ideia</button>
        <button class="status-btn s-aprovado ${currentStatus==='Aprovado'?'active':''}" onclick="setStatus('Aprovado')">Aprovado</button>
        <button class="status-btn s-usado ${currentStatus==='Usado'?'active':''}" onclick="setStatus('Usado')">Usado</button>
      </div>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalClick(e){ if(e.target === document.getElementById('modal-overlay')) closeModal(); }

// ── Status auto-save ──
async function setStatus(newStatus){
  if(!currentModalPost) return;
  const oldStatus = currentModalPost.status;
  if(newStatus === oldStatus) return;

  document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.status-btn.s-${newStatus.toLowerCase()}`)?.classList.add('active');

  const { error } = await db(() =>
    sb.from('inspiration_posts').update({ status: newStatus }).eq('id', currentModalPost.id),
    'Erro ao atualizar status'
  );
  if(error){
    document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.status-btn.s-${oldStatus.toLowerCase()}`)?.classList.add('active');
    return;
  }

  currentModalPost.status = newStatus;
  const idx = allPosts.findIndex(x => x.id === currentModalPost.id);
  if(idx >= 0) allPosts[idx].status = newStatus;
  renderPosts(true);
  loadStats();
  showToast('Status atualizado ✓', 'ok');
}

// ── Modal editar ──
function openEdit(p){
  editingPostId = p.id;
  document.getElementById('edit-title').value = p.title || '';
  document.getElementById('edit-caption').value = p.caption || '';
  document.getElementById('edit-status').value = p.status || 'Ideia';
  document.getElementById('edit-format').value = p.format || '';
  document.getElementById('edit-overlay').classList.add('open');
}

function closeEdit(){ document.getElementById('edit-overlay').classList.remove('open'); editingPostId = null; }
function closeEditClick(e){ if(e.target === document.getElementById('edit-overlay')) closeEdit(); }

async function saveEdit(){
  if(!editingPostId) return;
  const updates = {
    title: document.getElementById('edit-title').value.trim(),
    caption: document.getElementById('edit-caption').value.trim(),
    status: document.getElementById('edit-status').value,
    format: document.getElementById('edit-format').value.trim(),
  };
  const { error } = await db(() => sb.from('inspiration_posts').update(updates).eq('id', editingPostId), 'Erro ao salvar post');
  if(error){ return; }

  // Atualiza cache local
  const idx = allPosts.findIndex(p => p.id === editingPostId);
  if(idx >= 0) allPosts[idx] = { ...allPosts[idx], ...updates };
  renderPosts(true);
  closeEdit();
  showToast('Post atualizado ✓','ok');
  loadStats();
}

// ── Deletar ──
async function deletePost(p){
  openConfirmModal('Excluir post', `Excluir "${esc(p.title)}"?`, async () => {
    const { error } = await db(() => sb.from('inspiration_posts').delete().eq('id', p.id), 'Erro ao excluir post');
    if(error){ return; }
    allPosts = allPosts.filter(x => x.id !== p.id);
    totalCount--;
    renderPosts(true);
    updateBancoMeta();
    showToast('Post excluído','ok');
    loadStats();
  });
}

// ── Util ──
function escHtml(s){
  if(!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Start ──
init();
</script>
